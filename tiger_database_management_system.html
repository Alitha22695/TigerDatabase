function fdate(d){if(!d)return'—';const[y,m,day]=d.split('-');return`${+day} ${MN[+m-1]} ${y}`}
function av(tid,sz=28){const c=TC[tid]||'#6B7280';return`<div class="avatar" style="background:${c};width:${sz}px;height:${sz}px;font-size:${sz<34?9:11}px">${tid.replace('TGR-','')}</div>`}
function bsex(s){return`<span class="badge b${s}">${SEX[s]}</span>`}
function bside(s){return`<span class="badge b${s}">${SIDE[s]}</span>`}
function gsfor(tid){return sightings.filter(s=>s.tigerId===tid).sort((a,b)=>b.date.localeCompare(a.date))}
function gcnt(tid){return gsfor(tid).length}
function glast(tid){const s=gsfor(tid);return s[0]||null}

function go(p){
  page=p;

  const m=document.getElementById('main');
  if(p==='dashboard'){m.innerHTML=rdash();icharts();}
  else if(p==='individu'){m.innerHTML=rindiv();}
  else if(p==='data'){m.innerHTML=rdata();}
  else if(p==='peta'){m.innerHTML=rpeta();setTimeout(imap,120);}
}

  const mc=document.getElementById('cm');

function gfs(){
  let f=sightings.filter(s=>{const q=dsearch.toLowerCase();return(!q||s.tigerId.toLowerCase().includes(q)||s.notes.toLowerCase().includes(q))&&(!dsex||s.sex===dsex)});
  f.sort((a,b)=>{let va=a[dsort],vb=b[dsort];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase()}if(va<vb)return dasc?-1:1;if(va>vb)return dasc?1:-1;return 0});
  return f;
}

function rdata(){
  const f=gfs();const tp=Math.max(1,Math.ceil(f.length/PER));if(dpage>tp)dpage=tp;
  const pg=f.slice((dpage-1)*PER,dpage*PER);
  const si=c=>c===dsort?(dasc?' ↑':' ↓'):'';
  const rows=pg.map((s,i)=>`<tr><td style="color:var(--color-text-secondary)">${(dpage-1)*PER+i+1}</td><td><div style="display:flex;align-items:center;gap:6px">${av(s.tigerId,22)}<span style="font-weight:500">${s.tigerId}</span></div></td><td>${bsex(s.sex)}</td><td style="font-size:11px;font-family:monospace">${s.lat.toFixed(4)}</td><td style="font-size:11px;font-family:monospace">${s.lng.toFixed(4)}</td><td>${bside(s.side)}</td><td>${fdate(s.date)}</td><td style="color:var(--color-text-secondary)">${s.time}</td><td><div style="display:flex;gap:2px">${s.sL?'<span style="font-size:9px;background:#EAF3DE;color:#3B6D11;padding:1px 4px;border-radius:3px">L</span>':''}${s.sR?'<span style="font-size:9px;background:#E1F5EE;color:#0F6E56;padding:1px 4px;border-radius:3px">R</span>':''}</div></td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-secondary);font-size:11px">${s.notes||'—'}</td><td><div style="display:flex;gap:3px"><button class="btn" style="padding:3px 7px" onclick="openEdit(${s.id})" aria-label="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button><button class="btn btn-d" style="padding:3px 7px" onclick="askDel(${s.id})" aria-label="Hapus"><i class="ti ti-trash" aria-hidden="true"></i></button></div></td></tr>`).join('');
  let pbtns='';for(let p=1;p<=Math.min(tp,6);p++)pbtns+=`<button class="pb ${p===dpage?'active':''}" onclick="sdp(${p})">${p}</button>`;
  return`<div class="topbar"><div><div class="pt">Data Rekaman</div><div class="ps">${sightings.length} total rekaman</div></div><div style="display:flex;gap:7px"><button class="btn" onclick="xcsv()"><i class="ti ti-download" aria-hidden="true"></i> CSV</button><button class="btn btn-p" onclick="openAdd()"><i class="ti ti-plus" aria-hidden="true"></i> Tambah</button></div></div>
  <div class="searchbar"><i class="ti ti-search" style="font-size:14px;color:var(--color-text-secondary)" aria-hidden="true"></i><input class="si" type="search" placeholder="Cari ID harimau atau catatan..." value="${dsearch}" oninput="dsearch=this.value;dpage=1;refreshD()" aria-label="Cari"><select class="fs" onchange="dsex=this.value;dpage=1;refreshD()" aria-label="Filter JK"><option value="" ${!dsex?'selected':''}>Semua JK</option><option value="M" ${dsex==='M'?'selected':''}>Jantan</option><option value="F" ${dsex==='F'?'selected':''}>Betina</option><option value="U" ${dsex==='U'?'selected':''}>Tdk Diketahui</option></select><span style="font-size:11px;color:var(--color-text-secondary)">${f.length} hasil</span></div>
  <div style="overflow-x:auto"><table class="dtable"><thead><tr><th onclick="srt('id')">No${si('id')}</th><th onclick="srt('tigerId')">ID${si('tigerId')}</th><th onclick="srt('sex')">JK${si('sex')}</th><th onclick="srt('lat')">Lat${si('lat')}</th><th onclick="srt('lng')">Lng${si('lng')}</th><th onclick="srt('side')">Belang${si('side')}</th><th onclick="srt('date')">Tanggal${si('date')}</th><th onclick="srt('time')">Waktu${si('time')}</th><th>Foto</th><th>Notes</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan="11" style="text-align:center;padding:20px;color:var(--color-text-secondary);font-size:12px">Tidak ada data.</td></tr>'}</tbody></table></div>
  <div class="pagi"><span style="color:var(--color-text-secondary);margin-right:6px">Hal. ${dpage}/${tp}</span><button class="pb" onclick="sdp(${dpage-1})" ${dpage===1?'disabled':''}>‹</button>${pbtns}<button class="pb" onclick="sdp(${dpage+1})" ${dpage===tp?'disabled':''}>›</button></div>`;
}

function refreshD(){document.getElementById('main').innerHTML=rdata()}
function srt(c){if(dsort===c)dasc=!dasc;else{dsort=c;dasc=true}refreshD()}
function sdp(p){const t=Math.ceil(gfs().length/PER);dpage=Math.max(1,Math.min(p,t));refreshD()}

function xcsv(){
  const rows=[['No','ID Harimau','JK','Lat','Lng','Belang','Tanggal','Waktu','Foto Kiri','Foto Kanan','Notes']];
  sightings.forEach((s,i)=>rows.push([i+1,s.tigerId,SEX[s.sex],s.lat,s.lng,SIDE[s.side],s.date,s.time,s.sL?'Ya':'Tidak',s.sR?'Ya':'Tidak',s.notes]));
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tdms_rekaman.csv';a.click();
}

function gform(s){
  const opts=tigers.map(t=>`<option value="${t.id}" ${s&&s.tigerId===t.id?'selected':''}>${t.id}${t.name?' · '+t.name:''}</option>`).join('');
  return`<div class="fr"><div class="fg"><label class="fl" for="ftiger">ID Harimau <span style="color:var(--color-text-danger)">*</span></label><select class="fi" id="ftiger"><option value="">-- Pilih --</option>${opts}</select></div>
  <div class="fg"><label class="fl">Jenis Kelamin <span style="color:var(--color-text-danger)">*</span></label><div class="frg" style="margin-top:6px"><label class="frl"><input type="radio" name="fsex" value="M" ${s&&s.sex==='M'?'checked':''}> Jantan</label><label class="frl"><input type="radio" name="fsex" value="F" ${s&&s.sex==='F'?'checked':''}> Betina</label><label class="frl"><input type="radio" name="fsex" value="U" ${s&&s.sex==='U'||!s?'checked':''}> Tdk Diketahui</label></div></div></div>
  <div class="fg"><label class="fl">Foto Belang <span style="color:var(--color-text-danger)">*</span></label><div class="frg"><label class="frl"><input type="checkbox" id="fsl" ${s&&(s.side==='left'||s.side==='both')?'checked':''}> Kiri</label><label class="frl"><input type="checkbox" id="fsr" ${s&&(s.side==='right'||s.side==='both')?'checked':''}> Kanan</label></div></div>
  <div class="fr"><div class="fg"><label class="fl" for="flat">Koordinat Y / Latitude <span style="color:var(--color-text-danger)">*</span></label><input class="fi" type="number" id="flat" step="0.0001" min="-90" max="90" placeholder="-0.4200" value="${s?s.lat:''}"></div>
  <div class="fg"><label class="fl" for="flng">Koordinat X / Longitude <span style="color:var(--color-text-danger)">*</span></label><input class="fi" type="number" id="flng" step="0.0001" min="-180" max="180" placeholder="102.5800" value="${s?s.lng:''}"></div></div>
  <div class="fr"><div class="fg"><label class="fl" for="fdate">Tanggal <span style="color:var(--color-text-danger)">*</span></label><input class="fi" type="date" id="fdate" value="${s?s.date:''}" max="2026-05-26"></div>
  <div class="fg"><label class="fl" for="ftime">Waktu <span style="color:var(--color-text-danger)">*</span></label><input class="fi" type="time" id="ftime" value="${s?s.time:''}"></div></div>
  <div class="fr" style="margin-bottom:12px">
    <div><div class="fl">Foto Belang Kiri (JPG/PNG ≤10MB)</div><div class="fub" style="margin-top:4px" onclick="this.querySelector('input').click()"><input type="file" accept="image/*" onchange="prevPhoto(this,'psl')" style="display:none"><i class="ti ti-upload" aria-hidden="true" style="font-size:16px"></i><div style="font-size:10px">${s&&s.sL?'Ada foto tersimpan':'Klik upload'}</div></div><div id="psl" class="pp">${s&&s.sL?'<div class="pph"><i class="ti ti-photo" aria-hidden="true"></i></div>':''}</div></div>
    <div><div class="fl">Foto Belang Kanan (JPG/PNG ≤10MB)</div><div class="fub" style="margin-top:4px" onclick="this.querySelector('input').click()"><input type="file" accept="image/*" onchange="prevPhoto(this,'psr')" style="display:none"><i class="ti ti-upload" aria-hidden="true" style="font-size:16px"></i><div style="font-size:10px">${s&&s.sR?'Ada foto tersimpan':'Klik upload'}</div></div><div id="psr" class="pp">${s&&s.sR?'<div class="pph"><i class="ti ti-photo" aria-hidden="true"></i></div>':''}</div></div>
  </div>
  <div class="fr" style="margin-bottom:12px">
    <div><div class="fl">Lampiran Foto Kiri (multi)</div><div class="fub" style="margin-top:4px" onclick="this.querySelector('input').click()"><input type="file" accept="image/*,video/*" multiple onchange="prevMulti(this,'pal')" style="display:none"><i class="ti ti-paperclip" aria-hidden="true" style="font-size:16px"></i><div style="font-size:10px">Kamera trap sisi kiri</div></div><div id="pal" class="pp"></div></div>
    <div><div class="fl">Lampiran Foto Kanan (multi)</div><div class="fub" style="margin-top:4px" onclick="this.querySelector('input').click()"><input type="file" accept="image/*,video/*" multiple onchange="prevMulti(this,'par')" style="display:none"><i class="ti ti-paperclip" aria-hidden="true" style="font-size:16px"></i><div style="font-size:10px">Kamera trap sisi kanan</div></div><div id="par" class="pp"></div></div>
  </div>
  <div class="fg"><label class="fl" for="fnotes">Catatan Lapangan (opsional, maks 2000 karakter)</label><textarea class="fi" id="fnotes" rows="3" maxlength="2000" style="resize:vertical" placeholder="Deskripsi kondisi, perilaku, atau informasi penting...">${s?s.notes:''}</textarea></div>`;
}

function prevPhoto(inp,pid){const c=document.getElementById(pid);if(!c)return;c.innerHTML='';if(inp.files[0]){const r=new FileReader();r.onload=e=>{const img=document.createElement('img');img.src=e.target.result;img.className='pt2';img.alt='Preview';c.appendChild(img)};r.readAsDataURL(inp.files[0])}}
function prevMulti(inp,pid){const c=document.getElementById(pid);if(!c)return;c.innerHTML='';Array.from(inp.files).slice(0,3).forEach(f=>{if(f.type.startsWith('image/')){const r=new FileReader();r.onload=e=>{const img=document.createElement('img');img.src=e.target.result;img.className='pt2';img.alt='Preview';c.appendChild(img)};r.readAsDataURL(f)}else{const ph=document.createElement('div');ph.className='pph';ph.innerHTML='<i class="ti ti-video" aria-hidden="true"></i>';c.appendChild(ph)}})}

function openAdd(){editId=null;document.getElementById('mtitle').textContent='Tambah Rekaman Baru';document.getElementById('mbody').innerHTML=gform(null);document.getElementById('modal').classList.add('open')}
function openEdit(id){const s=sightings.find(x=>x.id===id);if(!s)return;editId=id;document.getElementById('mtitle').textContent=`Edit Rekaman — ${s.tigerId}`;document.getElementById('mbody').innerHTML=gform(s);document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');editId=null}

function saveSighting(){
  const tid=document.getElementById('ftiger').value;
  const sex=document.querySelector('input[name="fsex"]:checked')?.value;
  const lat=parseFloat(document.getElementById('flat').value);
  const lng=parseFloat(document.getElementById('flng').value);
  const sl=document.getElementById('fsl').checked;
  const sr=document.getElementById('fsr').checked;
  const date=document.getElementById('fdate').value;
  const time=document.getElementById('ftime').value;
  const notes=document.getElementById('fnotes').value;
  if(!tid){alert('Pilih ID Harimau.');return}
  if(!sex){alert('Pilih jenis kelamin.');return}
  if(!sl&&!sr){alert('Pilih minimal satu sisi belang.');return}
  if(isNaN(lat)||lat<-90||lat>90){alert('Koordinat Y tidak valid (−90 s/d 90).');return}
  if(isNaN(lng)||lng<-180||lng>180){alert('Koordinat X tidak valid (−180 s/d 180).');return}
  if(!date){alert('Tanggal wajib diisi.');return}
  if(!time){alert('Waktu wajib diisi.');return}
  const side=sl&&sr?'both':sl?'left':'right';
  if(editId){const i=sightings.findIndex(s=>s.id===editId);if(i>=0)sightings[i]={...sightings[i],tigerId:tid,sex,lat,lng,side,date,time,notes,sL:sl,sR:sr}}
  else sightings.push({id:nid++,tigerId:tid,sex,lat,lng,side,date,time,notes,sL:sl,sR:sr});
  closeModal();refreshD();
}

function askDel(id){delId=id;document.getElementById('confirm').classList.add('open')}
function cancelDel(){delId=null;document.getElementById('confirm').classList.remove('open')}
function confirmDel(){if(delId)sightings=sightings.filter(s=>s.id!==delId);delId=null;document.getElementById('confirm').classList.remove('open');refreshD()}

function rpeta(){
  const topts=tigers.map(t=>`<option value="${t.id}">${t.id}${t.name?' · '+t.name:''}</option>`).join('');
  return`<div class="topbar"><div><div class="pt">Peta Sebaran</div><div class="ps">${sightings.length} titik rekaman</div></div></div>
  <div class="searchbar"><i class="ti ti-filter" style="font-size:14px;color:var(--color-text-secondary)" aria-hidden="true"></i><select class="fs" onchange="mtiger=this.value;umm()" aria-label="Filter individu"><option value="">Semua Individu</option>${topts}</select><select class="fs" onchange="msex=this.value;umm()" aria-label="Filter JK"><option value="">Semua JK</option><option value="M">Jantan</option><option value="F">Betina</option><option value="U">Tdk Diketahui</option></select><div style="margin-left:auto;font-size:10px;color:var(--color-text-secondary);display:flex;gap:12px"><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#185FA5;display:inline-block"></span>Jantan</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#B5456B;display:inline-block"></span>Betina</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#888780;display:inline-block"></span>Tdk Diketahui</span></div></div>
  <div style="padding:14px 18px"><div id="map"></div></div>`;
}

function imap(){
  if(typeof L==='undefined')return;
  if(lmap){lmap.remove();lmap=null}
  const el=document.getElementById('map');if(!el)return;
  lmap=L.map('map').setView([-0.5,102.0],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(lmap);
  umm();
}

function umm(){
  if(!lmap)return;
  lmarkers.forEach(m=>m.remove());lmarkers=[];
  const f=sightings.filter(s=>(!mtiger||s.tigerId===mtiger)&&(!msex||s.sex===msex));
  const sc={M:'#185FA5',F:'#B5456B',U:'#888780'};
  f.forEach(s=>{
    const col=sc[s.sex]||'#888780';
    const icon=L.divIcon({className:'',html:`<div style="width:13px;height:13px;border-radius:50%;background:${col};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,iconSize:[13,13],iconAnchor:[6,6]});
    const t=tigers.find(x=>x.id===s.tigerId);
    const pop=`<div style="font-family:sans-serif;font-size:11px;min-width:150px"><div style="font-weight:600;margin-bottom:3px">${s.tigerId}${t&&t.name?' · '+t.name:''}</div><div style="color:#555">${SEX[s.sex]} · ${SIDE[s.side]}</div><div style="color:#555;margin-top:2px">${fdate(s.date)} ${s.time}</div><div style="font-family:monospace;color:#555;margin-top:2px">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>${s.notes?`<div style="margin-top:4px;padding-top:4px;border-top:1px solid #eee">${s.notes}</div>`:''}</div>`;
    const mk=L.marker([s.lat,s.lng],{icon}).bindPopup(pop).addTo(lmap);
    lmarkers.push(mk);
  });
  if(lmarkers.length>0){const g=L.featureGroup(lmarkers);lmap.fitBounds(g.getBounds().pad(.3))}
}

go('dashboard');
</script>
